.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}

.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

*{box-sizing:border-box}
#fg-root{background:var(--anatomy-page);padding-block:40px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.iso-page{width:min(860px,100%);margin:0 auto}.fg, .fg-summary {
  --fg-led: #7fd8ff;

}
[data-theme="light"] .fg, [data-theme="light"] .fg-summary {
  --fg-led: #0077b6;

  --fg-hover: #0000000a;

  --fg-fixed: #1b1b19;
}
.fg .iso-plate { padding: 46px 20px 52px; overflow: hidden; }
.fg-stage { position: relative; outline: none; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.fg-stage svg { display: block; width: 100%; height: auto; }
.fg-led { fill: none; stroke: var(--fg-led); stroke-width: 1.4; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--fg-led)); }
.fg-slot { fill: var(--anatomy-shade-0); }
[data-control] { cursor: pointer; }
[data-control]:hover .iso-edge, [data-control]:focus .iso-edge { stroke: var(--anatomy-hi); }
.fg-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.fg-act { display: inline-flex; align-items: baseline; gap: 7px; padding: 5px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--anatomy-muted); font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; box-shadow: inset 0 0 0 1px var(--fg-ring); transition: color 160ms, background 160ms; }
.fg-act:hover, .fg-act:focus-visible, .fg-act[data-on] { color: var(--anatomy-strong); background: var(--fg-hover); outline: none; }
.fg-num { font-family: var(--anatomy-mono); font-size: 10px; color: var(--anatomy-muted); }
.fg-mark { width: 7px; height: 7px; border-radius: 50%; align-self: center; box-shadow: inset 0 0 0 1px var(--anatomy-mid); }
.fg-act[data-status="holds"] .fg-mark { background: var(--anatomy-mid); box-shadow: none; }
.fg-act[data-status="fails"] .fg-mark { background: var(--fg-fail); box-shadow: none; }
.fg-act[data-status="fixed"] .fg-mark { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-fixed); border-radius: 2px; transform: rotate(45deg); }
.fg-controls { font-size: 12px; color: var(--anatomy-muted); }
.iso-caption b { color: var(--anatomy-strong); font-weight: 500; }
.fg-summary { margin-top: 28px; }
.fg-summary[hidden] { display: none; }
.fg-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.fg-card { position: relative; border-radius: 12px; background: var(--anatomy-card); padding: 30px 10px 30px; }
.fg-card svg { display: block; width: 100%; height: auto; }
.fg-card .iso-plate-corners { inset: 12px 14px; }
.fg-verdict { margin-top: 14px; color: var(--anatomy-muted); font-size: 13px; line-height: 1.6; display: grid; gap: 8px; }
.fg-verdict b { color: var(--anatomy-strong); font-weight: 500; }
@media (max-width: 640px) { .fg .iso-plate { padding: 42px 6px 56px; } .fg-act { font-size: 12px; } }
.fg-card-words { margin: 8px 4px 0; font-size: 12px; color: var(--anatomy-muted); line-height: 1.5; }
.fg-card { overflow: hidden; } .fg-card svg { overflow: hidden; }
/* Repulsor lens and glow: the LED's light is the one colour, like the cuff's LED. */
.fg, .fg-summary { --im-lens:#0d1a20; --im-glow:#bff0ff; }
[data-theme="light"] .fg, [data-theme="light"] .fg-summary { --im-lens:#cfe9f2; --im-glow:#5fd0ff; }
.im-lens { fill: var(--im-lens); stroke: none; }
.im-glow { fill: var(--im-glow); stroke: none; filter: drop-shadow(0 0 4px var(--fg-led)) drop-shadow(0 0 10px var(--fg-led)); }
.im-beam { fill: var(--fg-led); stroke: none; }
[data-theme="light"] .im-beam { fill: #2aa9e0; }
.im-stop { stop-color: var(--fg-led); }
[data-theme="light"] .im-stop { stop-color: #2aa9e0; }
.rr-jet { stroke: none; }
.rr-stop { stop-color: #e9f1f5; }
[data-theme="light"] .rr-stop { stop-color: #9aa7ad; }
.rr-shadow { fill: var(--anatomy-shade-0); stroke: none; }
.fg-stage { overflow: hidden; }
.fg-stage > svg { aspect-ratio: 760 / 470; }
.rr-console { position: absolute; left: 0; bottom: -6px; width: min(240px, 34%); pointer-events: none; }
.rr-console svg { display: block; width: 100%; height: auto; pointer-events: auto; }
.rr-bom { width: 100%; border-collapse: collapse; font-size: 12.5px; color: var(--anatomy-muted); }
.rr-bom th { text-align: left; font-weight: 500; color: var(--anatomy-strong); padding: 6px 8px; border-bottom: 1px solid var(--fg-ring); }
.rr-bom td { padding: 6px 8px; border-bottom: 1px solid var(--fg-ring); vertical-align: top; }
.rr-bom td:nth-child(2) { white-space: nowrap; color: var(--anatomy-strong); }
@media (max-width: 640px) { .rr-console { width: 42%; } .rr-bom td:nth-child(3), .rr-bom th:nth-child(3) { display: none; } }

>03</span>Hop the row<span class="fg-mark" aria-hidden="true"></span></button><button type="button" class="fg-act" data-act="hover"><span class="fg-num">04</span>Fly<span class="fg-mark" aria-hidden="true"></span></button><button type="button" class="fg-act" data-act="cold"><span class="fg-num">05</span>Cold tanks<span class="fg-mark" aria-hidden="true"></span></button><button type="button" class="fg-act" data-act="summary"><span class="fg-num">★</span>Report<span class="fg-mark" aria-hidden="true"></span></button></span><span class="iso-caption" data-caption></span><span class="fg-controls">Console knobs, left to right: air tanks · lift nozzle size · landing burst · low-pressure cutoff. Gauges: tank pressure and tank temperature.</span></figcaption></figure><section class="fg-summary" data-summary hidden></section></main></div><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

      split(s0, s1, 0);

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

      out.to -= TAU;

    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

    for (let index = 0; index < hull.length; index++) {

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  power: { watts: 760000, range: [700000, 1000000], source: "Model S Plaid peak power 760 kW (Tesla; InsideEVs). The Roadster's three motors are assumed to be at least this." },
  suction: { kg: 2000, range: [1000, 2000], source: "McMurtry Spéirling fan car: about 2,000 kg of downforce at a standstill (McMurtry, via Wikipedia). Tesla says the Roadster uses suction; its figure is not published." },
  grip: { mu: 1.1, range: [1.0, 1.3], source: "Road tyre on dry asphalt, about 1.0–1.3 (typical; assumed)" },
  isp: { seconds: 69, range: [62, 76], source: "Cold nitrogen thruster, measured: 69 s (Univ. of Maryland SSL, vacuum) to 75.6 s (Beihang micro-thruster); ideal air 91 s (arXiv 1812.11662). Sea level costs a little more; 69 s taken." },
  compressibility: { bar: [0, 150, 300, 400], z: [1, 1, 1.1089, 1.2073], source: "Air at 300 K: Z = 1.1089 at 300 bar, 1.2073 at 400 bar (Wikipedia air table). Below 150 bar taken as 1." },
  tank: { kgPerLitreBar: 91 / (147.3 * 700), source: "DOE Hydrogen Program record 13010: a 700 bar Type IV tank with 147.3 L of gas needs 91 kg of carbon composite. Composite mass scales with pressure × volume." },
  linerCold: { celsius: -40, source: "Type IV tank service window −40 °C to +85 °C (as cited in rapid-fill and defuelling literature; SAE J2579 text not checked)" },
  bump: { g: 3, source: "Suspension designed for about 3 g on a vertical bump (3 × corner weight); a practitioner rule of thumb (eng-tips; Locost Builders), low confidence" },
  travel: { metres: 0.15, range: [0.11, 0.19], source: "Suspension travel plus tyre squash before the bump stops, about 0.12 + 0.03 m for a low sports car (typical; assumed)" },
  semi: { metres: 4.1, source: "A semi-truck cab is about 4.1 m tall (the tallest vehicle in the demo's row)" },
};

// The row in "Hop the row": vehicles parked side by side across the path, centred on the
// semi-truck cab. [offset along the path from the row's middle, width along the path, height] in m.
const ROW = [
  { name: "sedan", dx: -4.6, w: 1.85, h: 1.45 },
  { name: "suv", dx: -2.4, w: 1.95, h: 1.7 },
  { name: "semi", dx: 0, w: 2.5, h: 4.1 },
  { name: "pickup", dx: 2.5, w: 2.0, h: 1.95 },
  { name: "van", dx: 4.7, w: 2.0, h: 2.05 },
];
const CAR = { length: 4.6, belly: 0.15 };

const GAS = { R: 287.05, gamma: 1.4, g: 9.80665, T0: 293.15 };

const PARAMS = {
  litres: 600,
  bar: 380,
  liftArea: 13,
  rollThrust: 9000,
  retro: false,
  cutoff: 0,
  hopSpeed: 14,
  rampSpeed: 22,
  rampAngle: 22,
  rampHeight: 1.6,
  hoverGoal: 10,
};

const CONTROLS = {
  litres: { label: "Air tanks", values: [600, 900, 1200], unit: " L" },
  liftArea: { label: "Lift nozzles", values: [13, 18, 24], unit: " cm²" },
  retro: { label: "Landing burst", values: [false, true], names: { false: "off", true: "on" } },
  cutoff: { label: "Low-pressure cutoff", values: [0, 150, 200, 250], unit: " bar", names: { 0: "off" } },
};

const SCENARIOS = [
  { id: "how", name: "How it works", story: "Two carbon tanks of air at 380 bar feed ten nozzles round the body: two push, four lift, four roll." },
  { id: "launch", name: "Launch", story: "Standing start on the test track: tyres, suction and the rear thrusters together, 0 to 60 mph." },
  { id: "flip", name: "Kickflip", story: "Off a kicker ramp at 50 mph, the roll thrusters turn the car a full circle in the air before it lands." },
  { id: "hop", name: "Hop the row", story: "Rolling at 30 mph, the lift thrusters throw the car over a row of parked vehicles, a semi-truck the tallest." },
  { id: "hover", name: "Fly", story: "From a standstill, lift off and hold 2 m in the air for 10 seconds: real flight, not a hop." },
  { id: "cold", name: "Cold tanks", story: "The longest burn empties the tanks fast. Expanding air cools, and the tank liner has a cold limit." },
];

// ── The air ──────────────────────────────────────────────────────────────────
function zOf(bar) {
  const { bar: B, z: Z } = DATA.compressibility;
  if (bar <= B[0]) return Z[0];
  for (let i = 1; i < B.length; i++) if (bar <= B[i]) return Z[i - 1] + ((Z[i] - Z[i - 1]) * (bar - B[i - 1])) / (B[i] - B[i - 1]);
  return Z[Z.length - 1] + ((Z[Z.length - 1] - Z[Z.length - 2]) * (bar - B[B.length - 1])) / (B[B.length - 1] - B[B.length - 2]);
}
function airMass(p) {
  return (p.bar * 1e5 * (p.litres / 1000)) / (zOf(p.bar) * GAS.R * GAS.T0);
}
function tankMass(p) {
  return DATA.tank.kgPerLitreBar * p.litres * p.bar;
}
// Choked-nozzle mass flow per unit throat area at tank pressure P (Pa) and temperature T.
const CHOKE = Math.sqrt(GAS.gamma) * (2 / (GAS.gamma + 1)) ** ((GAS.gamma + 1) / (2 * (GAS.gamma - 1)));
const flux = (P, T) => (P * CHOKE) / Math.sqrt(GAS.R * T);
// Rear throat area that gives the claimed thrust from a full 380 bar tank.
function rearArea(env = {}) {
  const isp = env.isp ?? DATA.isp.seconds;
  return DATA.rearThrust.newtons / (isp * GAS.g) / flux(DATA.air.bar * 1e5, GAS.T0);
}

// A tank emptied fast: the gas left behind expands isentropically (no heat from the walls,
// so the cold side of the truth). Flow through each nozzle group is choked; the valves can
// only throttle it down. Thrust = flow × exhaust speed, and exhaust speed falls as √T.
function tankOf(p, env = {}) {
  const m0 = airMass(p);
  const V = p.litres / 1000;
  const rho0 = m0 / V;
  const isp0 = env.isp ?? DATA.isp.seconds;
  let m = m0;
  return {
    m0,
    get mass() { return m; },
    get rho() { return m / V; },
    get T() { return GAS.T0 * (this.rho / rho0) ** (GAS.gamma - 1); },
    get bar() { return p.bar * (this.rho / rho0) ** GAS.gamma; },
    get open() { return m > 0.5 && this.bar > (p.cutoff || 1.5); },
    // Largest thrust a nozzle group of throat area A (m²) can give right now.
    maxThrust(A) {
      if (!this.open) return 0;
      const ve = isp0 * GAS.g * Math.sqrt(this.T / GAS.T0);
      return flux((this.bar - 1) * 1e5, this.T) * A * ve;
    },
    // Fire a group at thrust F (clipped to what it can give) for dt; returns the thrust given.
    fire(A, F, dt) {
      const Fmax = this.maxThrust(A);
      const given = Math.max(0, Math.min(F, Fmax));
      if (given <= 0) return 0;
      const ve = isp0 * GAS.g * Math.sqrt(this.T / GAS.T0);
      m = Math.max(0, m - (given / ve) * dt);
      return given;
    },
  };
}

// Energy released if the tanks burst: isentropic expansion of the gas to 1 bar (Brode-style
// estimate used for pressure-vessel blast); TNT is 4.184 MJ/kg.
function storedEnergy(p) {
  const P1 = p.bar * 1e5, V = p.litres / 1000, g = GAS.gamma;
  return ((P1 * V) / (g - 1)) * (1 - (1e5 / P1) ** ((g - 1) / g));
}

const massOf = (p, env = {}) => (env.mass ?? DATA.mass.kg) + tankMass(p) + airMass(p);

// ── Scenarios, stepped through time ──────────────────────────────────────────
const DT = 0.004;
const MPH60 = 26.8224;

function simLaunch(p, env) {
  const tank = tankOf(p, env);
  const A = rearArea(env);
  const P = env.power ?? DATA.power.watts;
  const mu = env.mu ?? DATA.grip.mu;
  const suction = (env.suction ?? DATA.suction.kg) * GAS.g;
  const M = (env.mass ?? DATA.mass.kg) + tankMass(p);
  let v = 0, x = 0, t = 0;
  const track = [];
  while (v < MPH60 && t < 5) {
    const m = M + tank.mass;
    const tyre = Math.min(mu * (m * GAS.g + suction), P / Math.max(v, 0.5));
    const thrust = tank.fire(A, 1e9, DT);
    v += ((tyre + thrust) / m) * DT;
    x += v * DT;
    t += DT;
    if (track.length === 0 || t - track[track.length - 1].t >= 0.02) track.push({ t, x, z: 0, roll: 0, pitch: 0, v, bar: tank.bar, T: tank.T, jets: { rear: thrust } });
  }
  track.push({ t, x, z: 0, roll: 0, pitch: 0, v, bar: tank.bar, T: tank.T, jets: { rear: 0 } });
  return { time: t, used: tank.m0 - tank.mass, share: 1 - tank.mass / tank.m0, track };
}

function rollInertia(m) {
  return (m * (2.0 ** 2 + 1.15 ** 2)) / 12;
}

function simFlip(p, env) {
  const tank = tankOf(p, env);
  const m0 = massOf(p, env);
  const arm = 0.9;
  const Arole = rearArea(env) * 0.5;
  const a = (p.rampAngle * Math.PI) / 180;
  let x = 0, z = p.rampHeight, vx = p.rampSpeed * Math.cos(a), vz = p.rampSpeed * Math.sin(a);
  let roll = 0, w = 0, t = 0;
  const goal = 2 * Math.PI;
  const track = [];
  while ((z > 0 || t < 0.05) && t < 6) {
    const m = m0 - (tank.m0 - tank.mass);
    const I = rollInertia(m);
    const Fmax = Math.min(p.rollThrust, tank.maxThrust(Arole));
    const alpha = (Fmax * arm) / I;
    const left = goal - roll;
    const braking = left <= (w * w) / (2 * Math.max(alpha, 1e-6)) + 1e-4;
    let F = 0;
    if (left > 0.002 || Math.abs(w) > 0.01) F = tank.fire(Arole, Fmax, DT) * (braking ? -1 : 1);
    w += ((F * arm) / I) * DT;
    if (braking && w < 0) w = 0;
    roll += w * DT;
    vz -= GAS.g * DT;
    x += vx * DT;
    z += vz * DT;
    t += DT;
    if (track.length === 0 || t - track[track.length - 1].t >= 0.02) track.push({ t, x, z: Math.max(0, z), roll, pitch: 0, v: vx, bar: tank.bar, T: tank.T, jets: { roll: F } });
  }
  const error = Math.abs(((roll % goal) + goal) % goal);
  const off = Math.min(error, goal - error);
  track.push({ t, x, z: 0, roll, pitch: 0, v: vx, bar: tank.bar, T: tank.T, jets: {} });
  return { airtime: t, rollError: (off * 180) / Math.PI, used: tank.m0 - tank.mass, track };
}

function landingG(sink, env) {
  const s = env.travel ?? DATA.travel.metres;
  return 1 + (sink * sink) / (2 * GAS.g * s);
}

function simHop(p, env) {
  const tank = tankOf(p, env);
  const A = (p.liftArea * 1e-4);
  const m0 = massOf(p, env);
  const rowX = 22, rowH = DATA.semi.metres + 0.5;
  let x = 0, z = 0, vx = p.hopSpeed, vz = 0, t = 0;
  let phase = "burn";
  let braking = false;
  let clearance = Infinity;
  const track = [];
  // Start the burn so the apex lands over the row: burn plus climb take about 1.4 s.
  const lead = p.hopSpeed * 1.4;
  while (t < 8) {
    const m = m0 - (tank.m0 - tank.mass);
    let F = 0;
    if (phase === "burn" && x >= rowX - lead) {
      // Burn until the coast would carry the car over the row's top with its margin.
      F = tank.fire(A, 1e9, DT);
      const apex = z + (vz * vz) / (2 * GAS.g);
      if (apex >= rowH + 0.6 || F <= 0) phase = "coast";
    } else if (phase === "coast" && vz < 0 && p.retro) {
      // Landing burst, fired late and hard (it saves air): start when the stopping distance
      // at full lift equals the height left, and brake the fall to 1 m/s at the wheels.
      const amax = tank.maxThrust(A) / m - GAS.g;
      const stop = amax > 0 ? (vz * vz - 1) / (2 * amax) : Infinity;
      if (braking || z - 0.1 <= stop * 1.6) {
        braking = true;
        const need = (vz * vz - 1) / (2 * Math.max(z - 0.1, 0.05)) + GAS.g;
        if (vz < -1) F = tank.fire(A, m * need, DT);
      }
    }
    vz += (F / m - GAS.g) * DT;
    x += vx * DT;
    z += vz * DT;
    t += DT;
    // Lowest point of the car (its wheels) over every parked vehicle under its length.
    for (const v of ROW) {
      const x0 = rowX + v.dx - v.w / 2, x1 = rowX + v.dx + v.w / 2;
      if (x + CAR.length / 2 > x0 && x - CAR.length / 2 < x1) clearance = Math.min(clearance, z - v.h);
    }
    if (z <= 0 && t > 0.2 && phase !== "burn") break;
    if (phase === "burn" && z < 0) { z = 0; vz = Math.max(vz, 0); }
    if (track.length === 0 || t - track[track.length - 1].t >= 0.02) track.push({ t, x, z: Math.max(0, z), roll: 0, pitch: 0, v: vx, bar: tank.bar, T: tank.T, jets: { lift: F } });
  }
  const sink = Math.max(0, -vz);
  track.push({ t, x, z: 0, roll: 0, pitch: 0, v: vx, bar: tank.bar, T: tank.T, jets: {} });
  return { sink, g: landingG(sink, env), clearance, used: tank.m0 - tank.mass, track, rowX };
}

function simHover(p, env) {
  const tank = tankOf(p, env);
  const A = p.liftArea * 1e-4;
  const m0 = massOf(p, env);
  const hold = 2;
  let z = 0, vz = 0, t = 0, held = 0, minT = GAS.T0, minBar = p.bar;
  let up = false;
  const track = [];
  while (t < 30) {
    const m = m0 - (tank.m0 - tank.mass);
    // Height-hold: a stiff PD loop on the lift valves.
    const want = m * (GAS.g + 4 * (hold - z) - 3.2 * vz);
    const F = tank.fire(A, Math.max(0, want), DT);
    vz += (F / m - GAS.g) * DT;
    z += vz * DT;
    if (z <= 0) { z = 0; vz = Math.max(0, vz); if (up) break; }
    if (z > 1.5) up = true;
    if (up && z > hold - 0.4) held += DT;
    minT = Math.min(minT, tank.T);
    minBar = Math.min(minBar, tank.bar);
    t += DT;
    if (track.length === 0 || t - track[track.length - 1].t >= 0.025) track.push({ t, x: 0, z, roll: 0, pitch: 0, v: 0, bar: tank.bar, T: tank.T, jets: { lift: F } });
  }
  track.push({ t, x: 0, z: 0, roll: 0, pitch: 0, v: 0, bar: tank.bar, T: tank.T, jets: {} });
  return { held, sink: Math.max(0, -vz), minT, minBar, used: tank.m0 - tank.mass, track };
}

// ── State and checks ─────────────────────────────────────────────────────────
const SHORT = { launch: ["0–60 in", "too slow"], roll: ["lands", "off its wheels"], clear: ["clears by", "hits the row"], land: ["landing", "breaks"], hover: ["flies", "falls"], cold: ["tank", "too cold"] };
function check(id, label, value, mark, unit, sense, confidence, fmt, say) {
  const pass = sense === "under" ? value <= mark : value >= mark;
  const margin = sense === "under" ? mark / Math.max(value, 1e-9) : value / mark;
  const [what, bad] = SHORT[id];
  const text = fmt(value);
  return { id, label, value, mark, unit, sense, pass, margin, confidence, text, words: say(pass, value), short: `${what} ${text} · ${pass ? "holds" : bad}` };
}

function stateOf(p, scenario, env = {}) {
  const checks = [];
  if (scenario === "how") {
    return { scenario, checks, air: airMass(p), tanks: tankMass(p), mass: massOf(p, env), track: [{ t: 0, x: 0, z: 0, roll: 0, pitch: 0, v: 0, bar: p.bar, T: GAS.T0, jets: {} }] };
  }
  if (scenario === "launch") {
    const s = simLaunch(p, env);
    checks.push(check("launch", "0–60 mph", s.time, 1.0, "s", "under", "medium", (v) => `${v.toFixed(2)} s`, (ok, v) => (ok ? `0–60 mph in ${v.toFixed(2)} s, but it spends ${Math.round(s.used)} kg of air (${Math.round(s.share * 100)}% of the tanks) doing it` : `0–60 mph in ${v.toFixed(2)} s, slower than the sub-second claim`)));
    return { scenario, ...s, checks };
  }
  if (scenario === "flip") {
    const s = simFlip(p, env);
    checks.push(check("roll", "Roll error at touchdown", s.rollError, 10, "°", "under", "medium", (v) => `${Math.round(v)}° off`, (ok, v) => (ok ? `completes the full turn in ${s.airtime.toFixed(1)} s of air and lands within ${Math.round(v)}° of level` : `the roll thrusters can't finish the turn in ${s.airtime.toFixed(1)} s of air: it lands ${Math.round(v)}° off its wheels`)));
    return { scenario, ...s, checks };
  }
  if (scenario === "hop") {
    const s = simHop(p, env);
    checks.push(check("clear", "Clearance over the row", s.clearance, 0.3, "m", "over", "medium", (v) => `${v.toFixed(1)} m`, (ok, v) => (ok ? `clears the row, semi-truck and all, by ${v.toFixed(1)} m` : v < 0 ? `hits the row: its wheels come ${(-v).toFixed(1)} m too low` : `only ${v.toFixed(1)} m over the row`)));
    checks.push(check("land", "Landing load", s.g, DATA.bump.g, "g", "under", "low", (v) => `${v.toFixed(1)} g`, (ok, v) => (ok ? `touches down at ${s.sink.toFixed(1)} m/s: ${v.toFixed(1)} g through the suspension, inside its 3 g design load` : `falls the last metres freely and hits at ${s.sink.toFixed(1)} m/s: ${Math.round(v)} g through the suspension, against a 3 g design load. Wheels and wishbones break`)));
    return { scenario, ...s, checks };
  }
  if (scenario === "hover" || scenario === "cold") {
    const s = simHover(p, env);
    if (scenario === "hover") checks.push(check("hover", "Time in the air", s.held, p.hoverGoal, "s", "over", "medium", (v) => `${v.toFixed(1)} s`, (ok, v) => (ok ? `holds 2 m for ${v.toFixed(1)} s` : `holds 2 m for only ${v.toFixed(1)} s: by then the tank pressure is too low (${Math.round(s.minBar)} bar) for the lift nozzles to carry the car's weight, and it sinks back down`)));
    else checks.push(check("cold", "Coldest air in the tank", s.minT - 273.15, DATA.linerCold.celsius, "°C", "over", "low", (v) => `${Math.round(v)} °C`, (ok, v) => (ok ? `the air in the tank cools to ${Math.round(v)} °C, inside the liner's −40 °C limit` : `emptying from ${p.bar} to ${Math.round(s.minBar)} bar chills the air to ${Math.round(v)} °C, below the plastic liner's −40 °C limit`)));
    return { scenario, ...s, checks };
  }
  return { scenario, checks };
}

const RANGES = {
  launch: (r) => ({ mass: lerp(DATA.mass.range, r()), power: lerp(DATA.power.range, r()), suction: lerp(DATA.suction.range, r()), mu: lerp(DATA.grip.range, r()), isp: lerp(DATA.isp.range, r()) }),
  flip: (r) => ({ mass: lerp(DATA.mass.range, r()), isp: lerp(DATA.isp.range, r()) }),
  hop: (r) => ({ mass: lerp(DATA.mass.range, r()), isp: lerp(DATA.isp.range, r()), travel: lerp(DATA.travel.range, r()) }),
  hover: (r) => ({ mass: lerp(DATA.mass.range, r()), isp: lerp(DATA.isp.range, r()) }),
  cold: (r) => ({ mass: lerp(DATA.mass.range, r()), isp: lerp(DATA.isp.range, r()) }),
};
function lerp([a, b], t) { return a + (b - a) * t; }

function spreadOf(p, scenario, runs = 30) {
  let seed = 11;
  const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const values = {};
  for (let i = 0; i < runs; i++) {
    const s = stateOf(p, scenario, RANGES[scenario](r));
    for (const c of s.checks) (values[c.id] ??= []).push(c.value);
  }
  const out = {};
  for (const [id, list] of Object.entries(values)) {
    list.sort((a, b) => a - b);
    out[id] = { low: list[Math.floor(runs * 0.1)], high: list[Math.floor(runs * 0.9)] };
  }
  return out;
}

const cache = new Map();
function verdictOf(p, scenario) {
  const key = scenario + JSON.stringify(p);
  if (cache.has(key)) return cache.get(key);
  const s = stateOf(p, scenario);
  const spread = spreadOf(p, scenario);
  const checks = s.checks.map((c) => {
    const range = spread[c.id];
    const worst = c.sense === "under" ? range.high : range.low;
    const robust = c.sense === "under" ? worst <= c.mark : worst >= c.mark;
    return { ...c, range, status: !c.pass ? "fails" : robust ? "holds" : "close" };
  });
  const status = checks.some((c) => c.status === "fails") ? "fails" : checks.some((c) => c.status === "close") ? "close" : "holds";
  const out = { scenario, state: s, checks, status };
  cache.set(key, out);
  return out;
}

function campaign(p) {
  return SCENARIOS.filter((s) => s.id !== "how").map((s) => ({ ...s, ...verdictOf(p, s.id) }));
}

const LEVERS = [
  { key: "retro", values: [true], fixes: ["land"] },
  { key: "cutoff", values: [150, 200, 250], fixes: ["cold"] },
  { key: "liftArea", values: [18, 24], fixes: ["hover", "clear"] },
  { key: "litres", values: [900, 1200], fixes: ["hover"] },
];

// Smallest change that makes a failing check hold without breaking a passing act.
// Costs are kilograms added. A check no lever can fix is reported as a limit, not hidden.
function fixesOf(p) {
  const steps = [];
  const limits = [];
  let current = { ...p };
  for (let round = 0; round < 6; round++) {
    const runs = campaign(current);
    const failing = runs.flatMap((run) => run.checks.filter((c) => c.status !== "holds").map((c) => ({ act: run.id, id: c.id })));
    const open = failing.filter((f) => !limits.some((l) => l.act === f.act && l.id === f.id));
    if (!open.length) break;
    let best = null;
    const target = open[0];
    const tryChange = (change) => {
      const next = { ...current, ...change };
      if (Object.entries(change).every(([k, v]) => current[k] === v)) return;
      const after = verdictOf(next, target.act).checks.find((c) => c.id === target.id);
      // A fix may not make any act that holds now fail or turn too close to call.
      const broke = campaign(next).some((run) => run.status !== "holds" && !failing.some((f) => f.act === run.id));
      if (after.status !== "holds" || broke) return;
      const cost = massOf(next) - massOf(current);
      if (!best || cost < best.cost - 1e-9) best = { act: target.act, check: target.id, change, cost, next };
    };
    const fixers = LEVERS.filter((l) => l.fixes.includes(target.id));

    out.pose = { x: x * 100, y: D.LANE.launch, z: 0, jets: { rear: T <= end ? share(k.jets.rear, 80000) : 0 } };
    out.cam = { at: [x * 100 + 150, D.LANE.launch, 60], zoom: 1.5 };
    return out;
  }
  if (id === "flip") {
    const v = params.rampSpeed, a = (params.rampAngle * Math.PI) / 180;
    const rampLen = D.RAMP.len / 100;
    let pose;
    if (t < 0.8) {
      // Run-up and climb: 0.8 s before the lip, along the lane then up the deck.
      const back = (0.8 - t) * v * SPEED.flip * 1.25;
      const xr = -back;
      const onDeck = xr > -rampLen;
      const z = onDeck ? (params.rampHeight * (xr + rampLen)) / rampLen : 0;
      pose = { x: D.RAMP.x + xr * 100, y: D.LANE.flip, z: z * 100, pitch: onDeck ? a : 0, roll: 0 };
    } else {
      const over = Math.max(0, T - end);
      const fly = clamp(T / end, 0, 1);
      pose = { x: D.RAMP.x + (k.x + v * Math.cos(a) * over * 0.6) * 100, y: D.LANE.flip, z: k.z * 100, roll: k.roll, pitch: a * (1 - ease(fly * 1.4)), jets: { roll: T <= end ? Math.sign(k.jets.roll ?? 0) * share(k.jets.roll, params.rollThrust) : 0 } };
    }
    out.pose = pose;
    // Follow the car, but keep the lip of the ramp in shot until the car is well clear of it.
    const cx = Math.max(pose.x + 150, Math.min(D.RAMP.x + 900, pose.x + 700));
    out.cam = { at: [cx, D.LANE.flip, 80 + pose.z * 0.5], zoom: 0.8 };
    return out;
  }
  if (id === "hop") {
    const broke = failing("hop", "land") && T >= end;
    const over = Math.max(0, T - end);
    out.pose = { x: D.HOP_START + (k.x + (broke ? 0.4 * ease(over * 3) : Math.min(over, 1.5) * params.hopSpeed * 0.6)) * 100, y: D.LANE.hop, z: broke ? -6 * ease(over * 5) : k.z * 100, pitch: broke ? -0.06 * ease(over * 5) : 0, jets: { lift: T <= end ? share(k.jets.lift, 60000) : 0 }, lit: broke ? { wheels: true, body: true } : {} };
    out.cam = { at: [out.pose.x + 400, D.LANE.hop, 160], zoom: 0.62 };
    return out;
  }
  if (id === "hover" || id === "cold") {
    const sinking = id === "hover" && failing("hover", "hover") && T > end * 0.55 && k.z < 190;
    out.pose = { x: D.PAD.x, y: D.PAD.y, z: k.z * 100, jets: { lift: share(k.jets.lift, 60000) }, lit: sinking ? { body: true } : {} };
    if (id === "cold") {
      out.pose.open = ease(t / 0.8);
      out.pose.lit = { tanks: k.T - 273.15 < M.DATA.linerCold.celsius };
    }
    out.cam = { at: [D.PAD.x, D.PAD.y, id === "cold" ? 170 : 130], zoom: id === "cold" ? 1.55 : 1.3 };
    return out;
  }
  return out;
}

// ── Drawing ──────────────────────────────────────────────────────────────────
function knob(spot, index, n) {
  const a = -2.1 + (4.2 * index) / (n - 1);
  const top0 = D.DESK_H, top = top0 + 8;
  const tip = [spot.x + Math.sin(a) * 7.4, spot.y - Math.cos(a) * 7.4];
  return solidSvg(cylinder(spot.x, spot.y, 8, top0, 8, PC, 32, 0.4), { tone: "mid" }) + lineSvg(knurl(spot.x, spot.y, 8, top0 + 0.6, top - 1.2, 36, PC), { tone: "lo" }) + lineSvg(ring(spot.x, spot.y, 5.2, top, PC, 24), { tone: "faint" }) + `<path class="iso-line" data-tone="hi" data-free="end" d="${lineOnTop([spot.x, spot.y], tip, top, PC)}" style="stroke-width:1.1"/>` + dotsSvg([iso([spot.x, spot.y, top], PC)], { size: 0.55, tone: "hi" });
}
function needle(g, share) {
  const a = -2.1 + 4.2 * clamp(share, 0, 1);
  const top = D.DESK_H + 3.2;
  return `<path class="iso-line" data-tone="lit" data-free="" d="${lineOnTop([g.x - Math.sin(a) * 2, g.y + Math.cos(a) * 2], [g.x + Math.sin(a) * (g.r - 3.4), g.y - Math.cos(a) * (g.r - 3.4)], top, PC)}" style="stroke-width:1"/>` + lineSvg(ring(g.x, g.y, 1.3, top, PC, 12), { tone: "mid" });
}

function paint(f) {
  const pose = { ...f.pose, apart: Math.max(f.pose.apart ?? 0, apartNow) };
  carG.innerHTML = CARS.car(pose);
  shadowG.innerHTML = CARS.shadow(pose);
  // Props in front of the car are drawn after it, props behind before it.
  const carDepth = depthOf([pose.x, pose.y, (pose.z ?? 0) + 55], P);
  for (const p of propEls) {
    const front = depthOf(p.at, P) > carDepth;
    const placed = p.el.compareDocumentPosition(carG) & Node.DOCUMENT_POSITION_FOLLOWING ? "before" : "after";
    if (front && placed === "before") carG.after(p.el);
    if (!front && placed === "after") carG.before(p.el);
  }
  // Camera: the card is a window centred near the action.
  const c = iso(f.cam.at, P);
  const w = D.W / f.cam.zoom, h = D.H / f.cam.zoom;
  svg.setAttribute("viewBox", `${(c[0] - w / 2).toFixed(1)} ${(c[1] - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  gaugesG.innerHTML = needle(D.GAUGES[0], f.bar / 400) + needle(D.GAUGES[1], (f.T - 273.15 + 120) / 160);
  for (const [key, el] of Object.entries(knobEls)) {
    const n = M.CONTROLS[key].values.length;
    const want = knobAt[key];
    if (el.dataset.at !== String(want)) {
      el.dataset.at = String(want);
      el.innerHTML = knob(D.KNOBS.find((kn) => kn.key === key), want, n);
    }
  }
}

// ── Words ────────────────────────────────────────────────────────────────────
function statusOf(id) {
  if (id === "how" || id === "summary") return "";
  const v = verdict(id).status;
  if (v === "fails") failedOnce.add(id);
  if (v === "holds" && failedOnce.has(id)) return "fixed";
  return v === "close" ? "fails" : v;
}
function markActs() {
  for (const button of actButtons) {
    const id = button.dataset.act;
    const status = statusOf(id);
    if (status) button.dataset.status = status;
    else delete button.dataset.status;
    if (id === act) button.setAttribute("data-on", "");
    else button.removeAttribute("data-on");
  }
}
function words() {
  if (act === "summary") return finalWords();
  if (act === "how") return `${Math.round(M.airMass(params))} kg of air at ${params.bar} bar`;
  const v = verdict(act);
  const bad = v.checks.find((c) => c.status !== "holds");
  return (bad ?? v.checks[0]).short;
}
function finalWords() {
  const all = M.campaign(params);
  const bad = all.filter((r) => r.status !== "holds");
  return bad.length ? `${bad.length} of ${all.length} tests still fail` : `holds in all ${all.length} tests`;
}
const fmtRange = (c) => `${c.range.low.toFixed(c.unit === "s" || c.unit === "g" || c.unit === "m" ? 1 : 0)}–${c.range.high.toFixed(c.unit === "s" || c.unit === "g" || c.unit === "m" ? 1 : 0)} ${c.unit}`;
function caption() {
  if (act === "summary") return `<b>Report.</b> ${finalWords()}. See below.`;
  const lines = [`<b>${NAMES[act]}.</b> ${M.SCENARIOS.find((s) => s.id === act).story}`, WHY[act]];
  if (act !== "how") for (const c of verdict(act).checks) {
    const spread = Math.abs(c.range.high - c.range.low) > 1e-6;
    lines.push(`<b>${c.label}:</b> ${c.words[0].toUpperCase() + c.words.slice(1)}.${spread ? ` ${SPREAD[act]}: ${fmtRange(c)}.` : ""} Confidence ${c.confidence}.`);
  }
  if (act === "hover" && LIMITS.some((l) => l.act === "hover")) lines.push(`<b>No fix:</b> no change on the console makes this hold. Bigger tanks add carbon as fast as they add air, and bigger nozzles only spend it faster. Cold air can make a car hop, not fly.`);
  if (fixing) lines.push(`<b>Fix:</b> ${LEVER_WORDS[fixing.key](fixing.from, fixing.to)} (${fixing.cost >= 0 ? "+" : ""}${fixing.cost.toFixed(0)} kg). Same act again next.`);
  if (act === "launch") lines.push("Shown at 0.4× speed.");
  if (act === "flip") lines.push("Shown at 0.6× speed.");
  return lines.join(" ");
}
function say() {
  const title = act === "summary" ? "Report" : NAMES[act] + (mode === "fix" ? " · fixing" : "");
  if (titleEl.textContent !== title) titleEl.textContent = title;
  const text = mode === "fix" && fixing ? `fixing: ${LEVER_WORDS[fixing.key](fixing.from, fixing.to)}` : words();
  if (readout.textContent !== text) readout.textContent = text;
  const hint = touring ? "Watching the trials · click to take over" : apartTarget ? "Taken apart · click the car to put it back" : "Click the car to take it apart · click a knob to change it";
  if (hintEl.textContent !== hint) hintEl.textContent = hint;
  const html = caption();
  if (captionEl.innerHTML !== html) captionEl.innerHTML = html;
  stage.setAttribute("aria-label", `Rocket Roadster test site. ${title}: ${text}.`);
}

function start(id, m = "play", fix = null) {
  act = id;
  mode = m;
  clock = 0;
  fixing = fix;
  if (fix) fix.startIndex = knobAt[fix.key] ?? 0;
  summaryEl.hidden = id !== "summary";
  if (id === "summary") renderSummary();
  markActs();
  say();
  run();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += still.matches ? 99 : dt;
  apartNow = still.matches ? apartTarget : apartNow + (apartTarget - apartNow) * (1 - Math.exp(-dt * 3.2));
  if (Math.abs(apartTarget - apartNow) < 0.002) apartNow = apartTarget;
  if (mode === "fix" && fixing) {
    const share = ease((clock - 0.3) / 1.2);
    if (knobEls[fixing.key]) {
      const values = M.CONTROLS[fixing.key].values;
      knobAt[fixing.key] = fixing.startIndex + (values.indexOf(fixing.to) - fixing.startIndex) * share;
    }
    if (share >= 1 && params[fixing.key] !== fixing.to) {
      params = { ...params, [fixing.key]: fixing.to };
      markActs();
    }
  }
  const showId = act === "summary" ? "how" : act;
  const f = mode === "fix" ? frameOf(showId, "play", 0.2) : frameOf(showId, mode, act === "summary" ? 99 : clock);
  paint(f);
  say();
  const done = clock >= (act === "summary" ? 1 : durationOf(act, mode));
  if (done && touring) {
    tourIndex = (tourIndex + 1) % TOUR.length;
    if (tourIndex === 0) reset(false);
    const step = TOUR[tourIndex];
    // This frame is finishing: clear it so start() can schedule the next act's first frame.
    frame = 0;
    start(step.act, step.mode ?? "play", step.fix ?? null);
    return;
  }
  const moving = !done || apartNow !== apartTarget;
  frame = visible && (moving || touring) ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; tourIndex = 0; reset(true); } }, 20000);
}
function reset(play) {
  params = { ...INITIAL };
  failedOnce = new Set();
  apartTarget = 0;
  apartNow = 0;
  for (const key of Object.keys(knobAt)) knobAt[key] = M.CONTROLS[key].values.indexOf(params[key]);
  if (play) start(TOUR[0].act);
}
function setControl(key, index) {
  const spec = M.CONTROLS[key];
  const value = spec.values[(index + spec.values.length) % spec.values.length];
  params = { ...params, [key]: value };
  knobAt[key] = spec.values.indexOf(value);
  hintEl.textContent = `${spec.label}: ${spec.names?.[String(value)] ?? value + (spec.unit ?? "")}`;
  markActs();
  start(act === "summary" || act === "how" ? "hop" : act, "play");
}
function toggleApart() {
  takeOver();
  apartTarget = apartTarget ? 0 : 1;
  say();
  run();
}
for (const [key, el] of Object.entries(knobEls)) {
  el.style.cursor = "pointer";
  el.addEventListener("click", (event) => { event.stopPropagation(); takeOver(); setControl(key, M.CONTROLS[key].values.indexOf(params[key]) + 1); });
  el.addEventListener("pointerenter", () => { const spec = M.CONTROLS[key]; const value = params[key]; hintEl.textContent = `${spec.label}: ${spec.names?.[String(value)] ?? value + (spec.unit ?? "")} · click to change`; });
}
carG.style.cursor = "pointer";
carG.addEventListener("click", (event) => { event.stopPropagation(); toggleApart(); });
for (const button of actButtons) button.addEventListener("click", () => { takeOver(); start(button.dataset.act, "play"); });
stage.addEventListener("keydown", (event) => {
  const ids = M.SCENARIOS.map((s) => s.id);
  if (/^[0-5]$/.test(event.key)) { takeOver(); start(ids[Number(event.key)]); event.preventDefault(); }
  if (event.key === "s" || event.key === "S") { takeOver(); start("summary"); }
  if (event.key === "r" || event.key === "R") { takeOver(); reset(false); start("how"); }
  if (event.key === "a" || event.key === "A") { toggleApart(); event.preventDefault(); }
  if (event.key === "f" || event.key === "F") {
    const fix = M.fixesOf(params).steps.find((x) => x.act === act);
    if (fix) { takeOver(); start(fix.act, "fix", fix); setTimeout(() => start(fix.act), 2300); }
  }
});

// ── The report ───────────────────────────────────────────────────────────────
const KEY_TIME = { launch: (s) => 0.8 + endOf(s.track) / SPEED.launch, flip: (s) => 0.8 + (endOf(s.track) * 0.45) / SPEED.flip, hop: (s) => 0.8 + (s.track.reduce((b, p) => (p.z > b.z ? p : b)).t) / SPEED.hop, hover: (s) => 0.8 + (endOf(s.track) * 0.4) / SPEED.hover, cold: (s) => 0.8 + endOf(s.track) / SPEED.cold };
function cardSvg(id) {
  const f = frameOf(id, "play", KEY_TIME[id](stateFor(id)));
  const saved = { car: carG.innerHTML, shadow: shadowG.innerHTML, vb: svg.getAttribute("viewBox"), gauges: gaugesG.innerHTML };
  paint(f);
  const clone = svg.cloneNode(true);
  clone.removeAttribute("role");
  clone.setAttribute("aria-hidden", "true");
  carG.innerHTML = saved.car; shadowG.innerHTML = saved.shadow; svg.setAttribute("viewBox", saved.vb); gaugesG.innerHTML = saved.gauges;
  return clone.outerHTML;
}
const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
function bom(p) {
  // Carbon tanks: DOE's low-volume figure for 700 bar tanks (about $4,000 for 147 L at 10,000 a year),
  // scaled by pressure × volume, then ×3–5 for a one-off build. Valves and compressor from listings.
  const tankVolume = (4000 * (p.litres * p.bar)) / (147.3 * 700);
  const freeAir = M.airMass(p) / 1.204;
  return [
    { part: `2 carbon-wrapped air tanks, ${p.litres} L at ${p.bar} bar`, low: tankVolume * 3, high: tankVolume * 5, source: "DOE Hydrogen Program cost records 19008/24006 (700 bar Type IV, ~$21/kWh at 10k/yr), scaled; one-off factor assumed" },
    { part: "10 fast high-pressure valves (one per nozzle)", low: 10 * 570, high: 10 * 5000, source: "Omega SVH-110 from $570 (2015) is a small-orifice floor; valves big enough for these flows cost far more (assumed up to $5,000 each)" },
    { part: "10 machined nozzles and the manifold", low: 2000, high: 8000, source: "Machined steel/aluminium parts, rough shop estimate (assumed)" },
    { part: "High-pressure compressor (315 L/min, 330 bar, breathing-air grade)", low: 16000, high: 20000, source: "Coltri Super Silent 315 L/min, €14,999 list (tek-diver-shop.de)" },
    { refill: (freeAir * 1000) / 315 / 60 },
  ];
}
function renderSummary() {
  const runs = M.campaign(params);
  const history = FIXES.filter((f) => params[f.key] === f.to);
  const cards = runs.map((r, i) => {
    const status = statusOf(r.id);
    const w = (r.checks.find((c) => c.status !== "holds") ?? r.checks[0]).words;
    return `<div class="fg-card"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1${"abcde"[i]}</span><span class="iso-plate-corner" data-corner="title">${r.name}</span><span class="iso-plate-corner" data-corner="hint">${status || r.status}</span><span class="iso-plate-corner" data-corner="readout">${r.checks.find((c) => c.status !== "holds")?.text ?? r.checks[0].text}</span></div>${cardSvg(r.id)}<p class="fg-card-words">${w[0].toUpperCase() + w.slice(1)}.</p></div>`;
  });
  const bad = runs.filter((r) => r.status !== "holds");
  const hover = stateFor("hover");
  const good = runs.filter((r) => r.status === "holds").map((r) => r.name.toLowerCase());
  const flies = !bad.some((r) => r.id === "hover");
  const verdictLine = !bad.length
    ? `<b>Every test holds.</b>`
    : `<b>${flies ? "Not there yet." : "It hops; it doesn't fly."}</b> ${good.length ? `On compressed air it manages the ${good.join(", the ")}. ` : ""}Still failing: ${bad.map((r) => r.name).join(", ")}.${flies ? "" : ` Sustained flight is a limit, not a bug: the car holds 2 m for ${hover.held.toFixed(1)} s before the tanks lose pressure, and no change on the console fixes that, because bigger tanks add carbon as fast as they add air. That matches what Tesla showed: short hops and flips, no flight.`}${bad.some((r) => r.id !== "hover") ? " Press F on a failing act, or watch the tour, to let Forgesight fix the rest." : ""}`;
  const fixes = history.length ? `<b>What was fixed:</b> ${history.map((f) => `${NAMES[f.act]}: ${LEVER_WORDS[f.key](f.from, f.to)}${f.cost > 1 ? ` (+${Math.round(f.cost)} kg)` : ""}`).join("; ")}.` : "";
  const items = bom(params);
  const refill = items.pop().refill;
  const lo = items.reduce((a, b) => a + b.low, 0), hi = items.reduce((a, b) => a + b.high, 0);
  const table = `<table class="rr-bom"><thead><tr><th>Part</th><th>Cost</th><th>Where the number comes from</th></tr></thead><tbody>${items.map((b) => `<tr><td>${b.part}</td><td>${usd(b.low)}–${usd(b.high)}</td><td>${b.source}</td></tr>`).join("")}<tr><td><b>The air system</b></td><td><b>${usd(lo)}–${usd(hi)}</b></td><td>Low confidence: one-off parts at prototype prices, not Tesla's costs</td></tr></tbody></table>`;
  summaryEl.innerHTML = `<div class="fg-cards">${cards.join("")}</div><div class="fg-verdict"><span>${verdictLine}</span><span>${fixes}</span><span><b>Mass:</b> ${Math.round(M.massOf(params))} kg with ${Math.round(M.airMass(params))} kg of air in ${Math.round(M.tankMass(params))} kg of carbon tanks. <b>Turnaround:</b> refilling ${Math.round(M.airMass(params))} kg of air takes about ${refill.toFixed(0)} hours on a dive-shop compressor (315 L/min); a launch alone spends ${Math.round(stateFor("launch").used)} kg.</span>${table}<span><b>How sure:</b> medium on the launch, kickflip and hop, which rest on Tesla's own 80 kN and 380 bar figures, a real-gas air table and checked rocket formulas. Low on the landing (suspension travel and its 3 g design load are rules of thumb) and on the cold (no heat from the tank walls). Tesla has not published the car's weight, tank pressure or thrust, so every one of those is a reported or estimated figure, listed with its source in the model.</span><span><b>Before trusting it:</b> run every burst with no one in the car, as Tesla did; fill and empty the tanks behind a blast wall with thermocouples on the liner; drop-test the suspension from the hop's height before the first real landing; and never fill or vent near people: the full tanks store ${(M.storedEnergy(params) / 1e6).toFixed(0)} MJ, the burst energy of about ${Math.round(M.storedEnergy(params) / 4.184e6)} kg of TNT.</span></div>`;
}

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
markActs();
start("how");
</script>
